name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.9. Leave empty to use pubspec version without build suffix.
        required: false
        type: string
      channel:
        description: Update channel passed to Flutter dart-define.
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - dev
      build_installer:
        description: Also build the Inno Setup installer.
        required: true
        default: false
        type: boolean

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: vars
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($inputVersion)) {
            $pubspecVersion = (Select-String -Path "pubspec.yaml" -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
            $inputVersion = ($pubspecVersion -split '\+')[0]
          }
          "version=$inputVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "channel=${{ github.event.inputs.channel }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Flutter pub get
        shell: pwsh
        run: flutter pub get

      - name: Build Windows release zip
        shell: pwsh
        run: >
          .\dist_installer\build_release.ps1
          -Version "${{ steps.vars.outputs.version }}"
          -Channel "${{ steps.vars.outputs.channel }}"

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: Leemon_${{ steps.vars.outputs.version }}_win_x64_zip
          path: dist_installer/Leemon_${{ steps.vars.outputs.version }}_win_x64.zip
          if-no-files-found: error

      - name: Install Inno Setup
        if: ${{ github.event.inputs.build_installer == 'true' }}
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        if: ${{ github.event.inputs.build_installer == 'true' }}
        shell: pwsh
        run: >
          .\dist_installer\build_installer.ps1
          -Version "${{ steps.vars.outputs.version }}"

      - name: Upload installer
        if: ${{ github.event.inputs.build_installer == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Leemon_Setup_${{ steps.vars.outputs.version }}
          path: dist_installer/Leemon_Setup_${{ steps.vars.outputs.version }}.exe
          if-no-files-found: error
