name: leemon_app
description: "Flutter Desktop POS (Clean Architecture)"
publish_to: "none"
version: 1.0.8+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  intl: ^0.20.2
  google_fonts: ^6.3.2
  collection: ^1.18.0
  get_it: ^7.7.0
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  window_manager: ^0.5.1
  printing: ^5.14.2
  pdf: ^3.11.3
  drift: ^2.18.0
  drift_sqflite: ^2.0.0 
  path_provider: ^2.1.4
  package_info_plus: ^8.3.0
  path: ^1.9.0
  uuid: ^4.4.0
  flutter_svg: ^2.0.9
  provider: ^6.1.5+1
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.7
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/svg/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/leemon_icon.png
  remove_alpha_ios: true
